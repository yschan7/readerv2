<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Simple readerv2</title>

<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/cn2t.js"></script>

<style>
:root {
--bg-color: #000000;
--text-color: #e0e0e0;
--panel-bg: #000000;
--border-color: #222222;
--font-size: 26px;
--line-height: 1.4;
}

*, *::before, *::after {
box-sizing: border-box;
margin: 0;
padding: 0;
}

html {
scroll-behavior: auto !important;
background-color: var(--bg-color);
}

body {
background-color: var(--bg-color);
color: var(--text-color);
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
min-height: 100vh;
overflow-x: hidden;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
}

/* 雙行頂部工具列 */
.toolbar {
position: fixed;
top: 0;
left: 0;
right: 0;
z-index: 100;
background-color: var(--panel-bg);
border-bottom: 1px solid var(--border-color);
display: flex;
flex-direction: column;
gap: 6px;
padding: calc(env(safe-area-inset-top) + 8px) 10px 8px 10px;
transition: transform 0.2s ease;
}

.toolbar.hidden {
transform: translateY(-100%);
}

.toolbar-row {
display: flex;
flex-wrap: nowrap;
gap: 6px;
align-items: center;
overflow-x: auto;
white-space: nowrap;
width: 100%;
}

.toolbar-row::-webkit-scrollbar {
display: none;
}

.btn {
background-color: #1a1a1a;
color: var(--text-color);
border: 1px solid var(--border-color);
padding: 5px 9px;
border-radius: 6px;
font-size: 12px;
cursor: pointer;
user-select: none;
flex-shrink: 0;
}

.btn:active {
opacity: 0.6;
}

.progress-btn {
background-color: #1a1a1a;
color: #4CAF50;
border: 1px solid #4CAF50;
font-weight: bold;
flex-shrink: 0;
font-size: 12px;
padding: 5px 8px;
}

/* 進度滑桿容器 */
.progress-slider-container {
display: flex;
align-items: center;
flex: 1;
min-width: 100px;
}

.progress-slider {
width: 100%;
height: 4px;
-webkit-appearance: none;
appearance: none;
background: #222;
border-radius: 2px;
outline: none;
}

.progress-slider::-webkit-slider-thumb {
-webkit-appearance: none;
appearance: none;
width: 16px;
height: 16px;
border-radius: 50%;
background: #4CAF50;
cursor: pointer;
}

input[type="file"] {
display: none;
}

/* 文章內容區塊 */
.content-container {
width: 100%;
padding: calc(env(safe-area-inset-top) + 95px) 0px calc(env(safe-area-inset-bottom) + 60px) 0px;
font-size: var(--font-size);
line-height: var(--line-height);
word-break: break-word;
white-space: pre-wrap;
transform: translateZ(0);
}

.loading-status {
font-size: 11px;
color: #aaa;
flex-shrink: 0;
}

/* 浮動通知提示框 */
.toast-notice {
position: fixed;
top: calc(env(safe-area-inset-top) + 100px);
right: 20px;
background-color: rgba(30, 30, 30, 0.95);
color: #fff;
padding: 8px 14px;
border-radius: 8px;
font-size: 13px;
z-index: 300;
border: 1px solid #444;
pointer-events: none;
opacity: 0;
transition: opacity 0.2s ease;
}
.toast-notice.show {
opacity: 1;
}

/* 通用側邊欄抽屜 */
.drawer-modal {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-color: rgba(0, 0, 0, 0.6);
z-index: 200;
display: flex;
justify-content: flex-start;
align-items: stretch;
opacity: 0;
visibility: hidden;
transition: opacity 0.2s ease, visibility 0.2s ease;
}

.drawer-modal.active {
opacity: 1;
visibility: visible;
}

.drawer-content {
background-color: #111;
width: 50%;
height: 100%;
border-right: 1px solid #333;
display: flex;
flex-direction: column;
box-shadow: 4px 0 15px rgba(0,0,0,0.5);
transform: translateX(-100%);
transition: transform 0.25s ease;
}

.drawer-modal.active .drawer-content {
transform: translateX(0);
}

.drawer-header {
padding: 14px 16px;
border-bottom: 1px solid #222;
display: flex;
justify-content: space-between;
align-items: center;
font-weight: bold;
font-size: 15px;
color: #fff;
background-color: #151515;
}

.drawer-close {
background: none;
border: none;
color: #aaa;
font-size: 18px;
cursor: pointer;
}

.drawer-list {
flex: 1;
overflow-y: auto;
padding: 4px 0;
-webkit-overflow-scrolling: touch;
}

.drawer-item {
padding: 12px 16px;
font-size: 13px;
color: #ccc;
border-bottom: 1px solid #1a1a1a;
cursor: pointer;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
display: flex;
justify-content: space-between;
align-items: center;
}

.drawer-item:active {
background-color: #222;
color: #fff;
}

.drawer-empty {
padding: 30px;
text-align: center;
color: #666;
font-size: 13px;
}

.item-subtext {
font-size: 11px;
color: #777;
flex-shrink: 0;
}

.delete-btn {
background: #331111;
color: #ff6666;
border: 1px solid #552222;
padding: 2px 6px;
border-radius: 4px;
font-size: 11px;
cursor: pointer;
margin-left: 8px;
flex-shrink: 0;
}
.delete-btn:active {
background: #551111;
}
</style>
</head>

<div class="toolbar" id="toolbar">
    <div class="toolbar-row">

        <input type="file" id="fileInput" accept=".txt,.html,.md,.text">

        <button class="btn" id="shelfBtn">📚 書架</button>
        <button class="btn" id="tocBtn" style="

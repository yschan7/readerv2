<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 改為不透明純黑狀態列 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<!-- 強制瀏覽器與 iOS Web App 抓取最新版本，不使用舊快取 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Simple readerv2</title>

<!-- 高精準度 OpenCC 繁簡轉換庫 -->
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/cn2t.js"></script>

<style>
:root {
--bg-color: #000000; /* 專注純黑 */
--text-color: #e0e0e0;
--panel-bg: #000000; /* 工具列純黑不透明 */
--border-color: #222222;
--font-size: 26px;
--line-height: 1.4;
}

*, *::before, *::after {
box-sizing: border-box;
margin: 0;
padding: 0;
}

html {
scroll-behavior: auto !important;
background-color: var(--bg-color);
}

body {
background-color: var(--bg-color);
color: var(--text-color);
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
min-height: 100vh;
overflow-x: hidden;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
}

/* 頂部工具列 */
.toolbar {
position: fixed;
top: 0;
left: 0;
right: 0;
z-index: 100;
background-color: var(--panel-bg);
border-bottom: 1px solid var(--border-color);
display: flex;
flex-wrap: nowrap;
gap: 8px;
align-items: center;
padding: calc(env(safe-area-inset-top) + 8px) 12px 8px 12px;
overflow-x: auto;
white-space: nowrap;
transition: transform 0.2s ease;
}

.toolbar::-webkit-scrollbar {
display: none;
}

.toolbar.hidden {
transform: translateY(-100%);
}

.btn {
background-color: #1a1a1a;
color: var(--text-color);
border: 1px solid var(--border-color);
padding: 5px 10px;
border-radius: 6px;
font-size: 13px;
cursor: pointer;
user-select: none;
flex-shrink: 0;
}

.btn:active {
opacity: 0.6;
}

.progress-btn {
background-color: #1a1a1a;
color: #4CAF50;
border: 1px solid #4CAF50;
font-weight: bold;
flex-shrink: 0;
}

/* 進度滑桿容器 */
.progress-slider-container {
display: flex;
align-items: center;
flex: 1;
min-width: 100px;
}

.progress-slider {
width: 100%;
height: 4px;
-webkit-appearance: none;
appearance: none;
background: #222;
border-radius: 2px;
outline: none;
}

.progress-slider::-webkit-slider-thumb {
-webkit-appearance: none;
appearance: none;
width: 16px;
height: 16px;
border-radius: 50%;
background: #4CAF50;
cursor: pointer;
}

input[type="file"] {
display: none;
}

/* 文章內容區塊 */
.content-container {
width: 100%;
padding: calc(env(safe-area-inset-top) + 60px) 0px calc(env(safe-area-inset-bottom) + 60px) 0px;
font-size: var(--font-size);
line-height: var(--line-height);
word-break: break-word;
white-space: pre-wrap;
transform: translateZ(0);
}

.loading-status {
font-size: 12px;
color: #aaa;
flex-shrink: 0;
}

/* 目錄選單彈窗樣式 */
.toc-modal {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-color: rgba(0, 0, 0, 0.8);
z-index: 200;
display: flex;
justify-content: center;
align-items: flex-end;
opacity: 0;
visibility: hidden;
transition: opacity 0.2s ease, visibility 0.2s ease;
}

.toc-modal.active {
opacity: 1;
visibility: visible;
}

.toc-content {
background-color: #111;
width: 100%;
max-height: 70vh;
border-top-left-radius: 16px;
border-top-right-radius: 16px;
border-top: 1px solid #333;
display: flex;
flex-direction: column;
overflow: hidden;
}

.toc-header {
padding: 14px 16px;
border-bottom: 1px solid #222;
display: flex;
justify-content: space-between;
align-items: center;
font-weight: bold;
font-size: 16px;
color: #fff;
}

.toc-close {
background: none;
border: none;
color: #888;
font-size: 20px;
cursor: pointer;
}

.toc-list {
overflow-y: auto;
padding: 8px 0;
-webkit-overflow-scrolling: touch;
}

.toc-item {
padding: 12px 20px;
font-size: 15px;
color: #ccc;
border-bottom: 1px solid #1a1a1a;
cursor: pointer;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.toc-item:active {
background-color: #222;
color: #fff;
}

.toc-empty {
padding: 30px;
text-align: center;
color: #666;
font-size: 14px;
}
</style>
</head>
<body>

<div class="toolbar" id="toolbar">
<label class="btn" for="fileInput">📁 開啟檔案</label>
<input type="file" id="fileInput" accept=".txt,.html,.md,.text">

<button class="btn" id="tocBtn" style="display:none;">📑 目錄</button>

<button class="btn progress-btn" id="progressBtn">0.00%</button>

<div class="progress-slider-container">
<input type="range" class="progress-slider" id="progressSlider" min="0" max="100" step="0.1" value="0">
</div>

<span class="loading-status" id="statusText"></span>
</div>

<div class="content-container" id="textContent">
請點擊上方「開啟檔案」載入文章...
</div>

<!-- 目錄彈窗 -->
<div class="toc-modal" id="tocModal">
<div class="toc-content">
<div class="toc-header">
<span>文章目錄</span>
<button class="toc-close" id="tocClose">&times;</button>
</div>
<div class="toc-list" id="tocList">
<!-- 動態載入目錄 -->
</div>
</div>
</div>

<script>
// 初始化 OpenCC 繁簡轉換
const converter = window.OpenCC ? window.OpenCC.Converter({ from: 'cn', to: 'hk' }) : text => text;

// 將各類引號轉為標準繁體中文標點「」與『』
function formatQuotes(text) {
return text
.replace(/“/g, '「')
.replace(/”/g, '」')
.replace(/‘/g, '『')
.replace(/’/g, '』')
.replace(/"([^"]+)"/g, '「$1」')
.replace(/'([^']+)'/g, '『$1』');
}

const toolbar = document.getElementById('toolbar');
const textContent = document.getElementById('textContent');
const fileInput = document.getElementById('fileInput');
const progressBtn = document.getElementById('progressBtn');
const progressSlider = document.getElementById('progressSlider');
const statusText = document.getElementById('statusText');
const tocBtn = document.getElementById('tocBtn');
const tocModal = document.getElementById('tocModal');
const tocClose = document.getElementById('tocClose');
const tocList = document.getElementById('tocList');

let isUserDraggingSlider = false;
let currentFileKey = null; 
let chapterList = []; // 儲存解析到的目錄資訊

// 1. 點擊空白處隱藏/顯示選單
document.addEventListener('click', (e) => {
if (toolbar.contains(e.target) || tocModal.contains(e.target)) return;
toolbar.classList.toggle('hidden');
});

// 2. 儲存與讀取閱讀進度
function saveProgress(scrollTop) {
if (!currentFileKey) return;
try {
localStorage.setItem(`reader_pos_${currentFileKey}`, scrollTop);
} catch (e) {
console.error('儲存進度失敗:', e);
}
}

function getSavedProgress() {
if (!currentFileKey) return 0;
return parseFloat(localStorage.getItem(`reader_pos_${currentFileKey}`)) || 0;
}

// 3. 頁面滾動時更新 UI 與儲存進度
function updateProgressUI() {
const scrollTop = window.pageYOffset || document.documentElement.scrollTop || 0;

if (currentFileKey) {
saveProgress(scrollTop);
}

if (isUserDraggingSlider) return;

const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
if (scrollHeight <= 0) {
progressBtn.textContent = '0.00%';
progressSlider.value = 0;
return;
}

const percent = Math.min(100, Math.max(0, (scrollTop / scrollHeight) * 100));
progressBtn.textContent = `${percent.toFixed(2)}%`;
progressSlider.value = percent;
}

let scrollTimer;
window.addEventListener('scroll', () => {
if (scrollTimer) cancelAnimationFrame(scrollTimer);
scrollTimer = requestAnimationFrame(updateProgressUI);
}, { passive: true });

// 4. 滑桿拖動控制
progressSlider.addEventListener('mousedown', () => isUserDraggingSlider = true);
progressSlider.addEventListener('touchstart', () => isUserDraggingSlider = true, { passive: true });

progressSlider.addEventListener('input', (e) => {
const targetPercent = parseFloat(e.target.value);
progressBtn.textContent = `${targetPercent.toFixed(2)}%`;

const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
const targetY = (targetPercent / 100) * scrollHeight;

window.scrollTo(0, targetY);
});

progressSlider.addEventListener('mouseup', () => isUserDraggingSlider = false);
progressSlider.addEventListener('touchend', () => isUserDraggingSlider = false);

// 5. 點擊數字按鈕輸入精準進度
progressBtn.addEventListener('click', (e) => {
e.stopPropagation();
const currentVal = parseFloat(progressBtn.textContent) || 0;
const input = prompt('請輸入跳轉進度 (0 - 100):', currentVal.toFixed(2));

if (input !== null) {
const targetPercent = parseFloat(input);
if (!isNaN(targetPercent)) {
const clamped = Math.min(100, Math.max(0, targetPercent));
const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
const targetY = (clamped / 100) * scrollHeight;

window.scrollTo(0, targetY);
updateProgressUI();
}
}
});

// 目錄彈窗控制
tocBtn.addEventListener('click', (e) => {
e.stopPropagation();
tocModal.classList.add('active');
});

tocClose.addEventListener('click', () => {
tocModal.classList.remove('active');
});

tocModal.addEventListener('click', (e) => {
if (e.target === tocModal) {
tocModal.classList.remove('active');
}
});

// 自動辨識章節標題的正則表達式
// 支援：第一章、第1章、第一節、第1節、章節、以及常見的數字標題列
function parseChapters(fullText) {
const lines = fullText.split(/\r?\n/);
const chapters = [];
let charCount = 0;

// 比對模式：匹配「第X章/節」或「章節」等開頭，且長度適中不超過 30 字的行
const chapterRegex = /^\s*(?:第[0-9零一二三四五六七八九十百千]+[章節回幕卷]|chapter\s*\d+|[0-9一二三四五六七八九十]+[、\.])/i;

for (let i = 0; i < lines.length; i++) {
const line = lines[i].trim();
// 條件：符合章節格式，且整行字數小於 40 字（避免內文剛好包含關鍵字而被誤判）
if (line.length > 0 && line.length < 40 && chapterRegex.test(line)) {
chapters.push({
title: line,
charIndex: charCount
});
}
charCount += lines[i].length + 1; // +1 為換行符號
}
return chapters;
}

// 渲染目錄列表
function renderToc() {
tocList.innerHTML = '';
if (chapterList.length === 0) {
tocList.innerHTML = '<div class="toc-empty">未偵測到明確的章節目錄</div>';
return;
}

const totalLen = textContent.textContent.length || 1;

chapterList.forEach((ch, idx) => {
const item = document.createElement('div');
item.className = 'toc-item';
item.textContent = ch.title;
item.addEventListener('click', () => {
tocModal.classList.remove('active');
// 估算跳轉高度
const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
const ratio = Math.min(1, Math.max(0, ch.charIndex / totalLen));
window.scrollTo(0, ratio * scrollHeight);
updateProgressUI();
});
tocList.appendChild(item);
});
}

// 6. 檔案載入、轉碼、引號處理與自動恢復進度
fileInput.addEventListener('change', async (e) => {
const file = e.target.files[0];
if (!file) return;

currentFileKey = `${file.name}_${file.size}`;

statusText.textContent = '載入中...';
textContent.innerHTML = '';
tocBtn.style.display = 'none';

try {
const arrayBuffer = await file.arrayBuffer();
const uint8Array = new Uint8Array(arrayBuffer);

let encoding = 'utf-8';
try {
const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
utf8Decoder.decode(uint8Array.subarray(0, 5000));
} catch (err) {
encoding = 'gb18030';
}

const decoder = new TextDecoder(encoding);
const chunkSize = 100000;
let offset = 0;
const fragment = document.createDocumentFragment();
let fullRawText = '';

while (offset < uint8Array.length) {
const chunk = uint8Array.subarray(offset, offset + chunkSize);
const isFinal = offset + chunkSize >= uint8Array.length;
const textChunk = decoder.decode(chunk, { stream: !isFinal });

fullRawText += textChunk;
const convertedChunk = formatQuotes(converter(textChunk));
fragment.appendChild(document.createTextNode(convertedChunk));

offset += chunkSize;
statusText.textContent = `${Math.min(100, Math.round((offset / uint8Array.length) * 100))}%`;
await new Promise(r => setTimeout(r, 0));
}

textContent.appendChild(fragment);
toolbar.classList.remove('hidden');

// 解析目錄並顯示目錄按鈕
chapterList = parseChapters(fullRawText);
if (chapterList.length > 0) {
tocBtn.style.display = 'block';
renderToc();
}

// 讀取上次儲存的進度並恢復
const savedY = getSavedProgress();
if (savedY > 0) {
statusText.textContent = '已恢復閱讀進度';
setTimeout(() => { statusText.textContent = ''; }, 2000);

requestAnimationFrame(() => {
window.scrollTo(0, savedY);
updateProgressUI();
});
} else {
statusText.textContent = '';
window.scrollTo(0, 0);
updateProgressUI();
}

} catch (err) {
console.error(err);
statusText.textContent = '載入失敗';
}
});
</script>

</body>
</html>
